name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      # Boot Rails without needing config/master.key in CI.
      SECRET_KEY_BASE_DUMMY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          # Ruby version comes from backend/.ruby-version
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:test:prepare
      - name: Run tests
        run: bundle exec rspec

  backend_lint:
    name: Backend (Standard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: Lint
        run: bundle exec standardrb

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run tsc
      - name: Build
        run: npm run vite build
      - name: Run tests
        run: npm run test

  frontend_lint:
    name: Frontend (Biome format + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          # Keep in sync with @biomejs/biome in frontend/package.json
          version: 2.3.10
      # `biome ci` runs the formatter check, linter, and import sorting.
      - name: Format check + lint
        run: biome ci .
        working-directory: frontend
